spring:
  application:
    name: kcp-order
  h2:
    console:
      enabled: true  # H2 콘솔 활성화
      path: /h2-console  # 접속 경로 설정
      settings:
        web-allow-others: true # 외부 접속 허용 (필요시)
  datasource:
    order:
      hikari:
        driver-class-name: org.h2.Driver
        jdbc-url: jdbc:h2:mem:order;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        username: sa
        password: ''
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
